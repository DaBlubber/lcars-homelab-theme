<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="100%" height="100%">
  <!-- Neutral LCARS emblem, guacamole version: gold border, blue field, LCARS bars or an
       app symbol. Flat, no gradients. Same coordinate system as all
       integrations (100 x 116). -->
  <defs><clipPath id="em-clip-guacamole"><rect x="15" y="23" width="70" height="70" rx="10"/></clipPath></defs>
  <rect x="10" y="18" width="80" height="80" rx="14" fill="#eaa549"/>
  <rect x="15" y="23" width="70" height="70" rx="10" fill="#1740bc"/>
  <g clip-path="url(#em-clip-guacamole)">
    <g transform="translate(0,-12)">
      <rect x="30" y="52" width="40" height="28" rx="2" fill="#eaa549"/>
      <rect x="35" y="57" width="30" height="18" fill="#1740bc"/>
      <rect x="45" y="80" width="10" height="7" fill="#eaa549"/>
      <rect x="38" y="87" width="24" height="4" rx="2" fill="#eaa549"/>
    </g>
  </g>
</svg>
